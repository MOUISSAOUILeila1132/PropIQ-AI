# ============================================================
# PropIQ — GitHub Actions CI/CD (Phase 6 MLOps)
# ============================================================
# Déclencheurs : push / pull_request sur main et dev
# Jobs :
#   1. lint      → flake8 + bandit sur les fichiers MLOps
#   2. build     → docker build + push vers Docker Hub
#   3. deploy    → déploiement sur le serveur staging
# ============================================================

name: PropIQ CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DOCKER_IMAGE: propiq-app
  DOCKER_TAG: latest
  PYTHON_VERSION: "3.11"

# ============================================================
# JOB 1 — LINT & SECURITY
# ============================================================
jobs:
  lint:
    name: "🔍 Lint & Security"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Installation des outils CI"
        run: |
          pip install --upgrade pip
          pip install black flake8 bandit

      - name: "🎨 Vérification formatage (black)"
        run: |
          black --check --diff model_pipeline.py main.py mlflow_config.py
        continue-on-error: true   # non bloquant sur le code existant

      - name: "🔍 Lint MLOps files (flake8)"
        run: |
          flake8 model_pipeline.py main.py mlflow_config.py \
            --max-line-length=100 \
            --extend-ignore=E501,W503 \
            --exclude=venv,__pycache__

      - name: "🛡️ Security check (bandit)"
        run: |
          bandit -r model_pipeline.py main.py mlflow_config.py -ll

      - name: "📊 Rapport lint projet complet (non bloquant)"
        run: |
          flake8 app.py askQuestions.py complianceEngine.py config.py \
            credits.py human_evaluator.py laws_index.py \
            manual_evluation_cli.py qualityLife.py rag_evaluator.py \
            subscription.py translationEngine.py voiceEngine.py \
            monitoring.py \
            --max-line-length=100 \
            --extend-ignore=E501,W503 \
            --exclude=venv,__pycache__ || true

# ============================================================
# JOB 2 — BUILD & PUSH DOCKER
# ============================================================
  build:
    name: "🐳 Docker Build & Push"
    runs-on: ubuntu-latest
    needs: lint                  # ne démarre que si lint est OK

    # Ne pusher que sur push (pas sur pull_request)
    if: github.event_name == 'push'

    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      - name: "🔐 Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: "🏷️ Définir les tags Docker"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-

      - name: "⚡ Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🐳 Build & Push"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "✅ Image publiée"
        run: |
          echo "Image disponible : ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest"

# ============================================================
# JOB 3 — DEPLOY STAGING (main uniquement)
# ============================================================
  deploy:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4

      - name: "🚀 Deploy via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/propiq

            # Mettre à jour le docker-compose
            docker-compose pull propiq

            # Redémarrer uniquement l'app (sans toucher ES/Kibana)
            docker-compose up -d --no-deps propiq

            # Vérifier que le service répond
            sleep 15
            curl -f http://localhost:8000/api/health || exit 1

            echo "✅ Déploiement staging terminé"

      - name: "📢 Notification succès"
        if: success()
        run: |
          echo "::notice::🎉 PropIQ déployé avec succès sur staging !"

      - name: "🚨 Notification échec"
        if: failure()
        run: |
          echo "::error::❌ Échec du déploiement staging. Vérifier les logs."
