name: proptech_ai
description: PropTech AI - Real Estate Assistant for Setúbal, Portugal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation & State Management ──────────────────────────
  go_router: ^13.0.0
  provider: ^6.1.2

  # ── Réseau ─────────────────────────────────────────────────
  http: ^1.2.1
  dio: ^5.4.0

  # ── Stockage local ─────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── UI ─────────────────────────────────────────────────────
  flutter_markdown: ^0.6.22
  google_fonts: ^6.2.1
  icons_plus: ^5.0.0

  # ── Carte ──────────────────────────────────────────────────
  flutter_map: ^8.3.0
  flutter_map_cancellable_tile_provider: ^3.1.0
  latlong2: ^0.9.1

  # ── Médias ─────────────────────────────────────────────────
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  file_picker: ^8.0.0
  flutter_sound: ^9.2.13
  flutter_tts: ^4.0.2

  # ── Utilitaires ────────────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.3
  video_player: ^2.9.2
  # ── Firebase ───────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.12
  webview_flutter: ^4.13.1
  permission_handler: 11.3.1

  # ── AR ─────────────────────────────────────────────────────
  ar_flutter_plugin_2: 0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/robot_assistant.png
    - assets/images/robot_assistant-removebg-preview.png
    - assets/images/Hello.mp4
    - assets/images/Pika.mp4
